<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Pair phone · TunerBox</title>
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/remote.css">
</head>
<body class="pair">
<main class="pair-box">
  <img src="/static/icons/icon-192.png" alt="" class="pair-logo">
  <h1>Tuner<span>Box</span></h1>
  <p class="muted">On the TunerBox PC open <b>Setup › Phones › Pair a phone</b>, then scan the QR code or type the 6-digit code here.</p>
  <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
  <input id="name" maxlength="40" placeholder="Name this phone">
  <button id="go" class="big">Pair</button>
  <p id="msg" class="muted"></p>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const ua = navigator.userAgent;
  $("name").value = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android phone" : "Phone";
  const m = /^(\d{6})(?:\.([A-Za-z0-9_-]{8,}))?$/.exec(location.hash.slice(1));
  const key = m && m[2] ? m[2] : "";
  if (m) $("code").value = m[1];
  history.replaceState(null, "", location.pathname + location.search);   // keep the code out of history
  const next = new URLSearchParams(location.search).get("next") || "/remote";
  const say = (t, cls = "") => { $("msg").textContent = t; $("msg").className = cls || "muted"; };
  async function pair() {
    const code = $("code").value.replace(/\D/g, "");
    if (code.length !== 6) { say("Enter the 6-digit code from the PC", "bad"); return; }
    $("go").disabled = true; say("Pairing…");
    try {
      const r = await fetch("/api/pair/complete", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, name: $("name").value.trim() || "Phone", key }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.detail || r.statusText);
      say("Paired!", "ok");
      setTimeout(() => location.replace(next.startsWith("/") ? next : "/remote"), 500);
    } catch (e) { say(e.message, "bad"); } finally { $("go").disabled = false; }
  }
  $("go").onclick = pair;
  $("code").addEventListener("input", () => { if ($("code").value.replace(/\D/g, "").length === 6) pair(); });
  fetch("/api/me").then((r) => r.json()).then((me) => {
    if (me.paired || me.pc) { say(me.pc ? "This is the TunerBox PC: no pairing needed." : `Already paired as “${me.name}”.`, "ok");
      if (!m) setTimeout(() => location.replace(next), 900); }
    else if (m) pair();
  }).catch(() => {});
})();
</script>
</body>
</html>
